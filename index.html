<style>
/* Layout: a paper map on a pale sea, pan/zoom canvas left, a notebook panel right (bottom sheet on phones). */
:root {
  --sea: #dde8f1;
  --land: #fcfdff;
  --line: #8592a8;
  --ink: #23304a;
  --muted: #5b6780;
  --panel: #ffffff;
  --panel-line: #e1e6ee;
  --soft: #f1f4f8;
  --accent: #d9475f;
  --accent-ink: #ffffff;
  --label: #3a4560;
  --halo: rgba(252, 253, 255, .85);
  --shadow: 0 10px 30px rgba(35, 48, 74, .12);
  --c-peach: #f6b8a6;
  --c-butter: #f3dc86;
  --c-mint: #a7dbc2;
  --c-sky: #a9cbee;
  --c-lilac: #c8b5e8;
  --c-rose: #f1b2cd;
  --on-color: #26304a;
  --font-hand: "Gaegu", "Nanum Pen Script", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #101823; --land: #1c2635; --line: #4e5d76; --ink: #e7ecf5; --muted: #9ba7bc;
    --panel: #161f2c; --panel-line: #283346; --soft: #1e2938; --accent: #ff7d92; --accent-ink: #1a1220;
    --label: #c5cee0; --halo: rgba(28, 38, 53, .85); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #101823; --land: #1c2635; --line: #4e5d76; --ink: #e7ecf5; --muted: #9ba7bc;
  --panel: #161f2c; --panel-line: #283346; --soft: #1e2938; --accent: #ff7d92; --accent-ink: #1a1220;
  --label: #c5cee0; --halo: rgba(28, 38, 53, .85); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 1fr 380px; }
.stage { position: relative; min-width: 0; overflow: hidden; }

.topbar { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; z-index: 3; }
.brand { pointer-events: auto; }
.brand h1 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -.5px; }
.brand h1 .heart { color: var(--accent); margin: 0 2px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.dday { cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 999px; padding: 3px 11px 3px 9px; font-size: 12.5px; color: var(--muted); box-shadow: var(--shadow); white-space: nowrap; }
.dday .heart { color: var(--accent); font-size: 11px; }
.dday b { font-family: var(--font-hand); font-size: 19px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.dd-roll { display: grid; overflow: hidden; }
.dd-roll > span { grid-area: 1 / 1; display: inline-flex; align-items: baseline; gap: 4px; transform: translateY(110%); opacity: 0; transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .3s; }
.dd-roll > span.on { transform: none; opacity: 1; }
.dd-roll > span.out { transform: translateY(-110%); opacity: 0; }
.dday .dl { font-size: .92em; }
.dday.party { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.search { pointer-events: auto; position: relative; width: min(240px, 46vw); }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); }
.suggest { position: absolute; top: 40px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; }
.suggest button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; }
.suggest button:hover, .suggest button.on { background: var(--soft); }
.suggest small { color: var(--muted); }

svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg.map.dragging { cursor: grabbing; }
.rg { fill: var(--land); stroke: var(--line); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .25s; cursor: pointer; }
.rg:hover { stroke: var(--ink); stroke-width: 1.2; }
.rg.wish { fill: url(#hatch); }
.rg.visited.peach { fill: var(--c-peach); } .rg.visited.butter { fill: var(--c-butter); }
.rg.visited.mint { fill: var(--c-mint); } .rg.visited.sky { fill: var(--c-sky); }
.rg.visited.lilac { fill: var(--c-lilac); } .rg.visited.rose { fill: var(--c-rose); }
.sel { fill: none; stroke: var(--accent); stroke-width: 2.6; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.hatch-bg { fill: var(--land); } .hatch-line { stroke: var(--accent); stroke-width: 1.4; opacity: .55; }
.lb { font-family: var(--font-body); font-weight: 500; fill: var(--label); text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.lb.on-color { fill: var(--on-color); stroke: none; }
.lb.hide { display: none; }

.zoom { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 6px; z-index: 2; }
.zoom button { min-width: 38px; padding: 0 8px; height: 38px; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--panel); box-shadow: var(--shadow); font-size: 18px; line-height: 1; }
.legend { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 8px 12px; font-size: 12px; color: var(--muted); z-index: 2; box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.legend .l-none { background: var(--land); }
.legend .l-wish { background: repeating-linear-gradient(45deg, var(--land) 0 3px, var(--accent) 3px 4.5px); }
.legend .l-visit { background: linear-gradient(135deg, var(--c-peach), var(--c-mint) 50%, var(--c-sky)); }

/* panel */
.panel { background: var(--panel); border-left: 1px solid var(--panel-line); display: flex; flex-direction: column; min-height: 0; z-index: 4; }
.handle { display: none; }
.peek { display: none; }
.pbody { flex: 1; min-height: 0; overflow: auto; padding: 20px 20px 28px; display: grid; gap: 22px; align-content: start; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.rname { margin: 2px 0 0; font-family: var(--font-hand); font-weight: 700; font-size: 40px; line-height: 1.05; text-wrap: balance; }
.headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.close { border: 1px solid var(--panel-line); background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-top: 8px; }
.pill.none { background: var(--soft); color: var(--muted); }
.pill.wish { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.pill.visited { color: var(--on-color); }
h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.spots { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.spot { border: 1px solid var(--panel-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.spot b { font-size: 15px; font-weight: 600; }
.spot p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.spot a { font-size: 12.5px; color: var(--accent); text-decoration: none; justify-self: start; }
.spot a:hover { text-decoration: underline; }
.insta { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--soft); border: 1px dashed var(--line); font-weight: 600; }
.insta:hover { border-style: solid; }
.insta small { font-weight: 400; color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 9px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 12.5px; color: var(--muted); }
.field input[type=date], .field textarea { border: 1px solid var(--panel-line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
.field textarea { min-height: 84px; resize: vertical; font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--panel-line); outline-offset: -1px; }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.save { border: 0; border-radius: 12px; padding: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.save:disabled { opacity: .5; cursor: default; }
.meta { font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.memo-view { font-family: var(--font-hand); font-size: 20px; line-height: 1.35; white-space: pre-wrap; margin: 0; }

/* overview */
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-family: var(--font-hand); font-size: 56px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.prov { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.prov li { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; }
.prov .mini { height: 5px; border-radius: 9px; background: var(--soft); overflow: hidden; }
.prov .mini i { display: block; height: 100%; background: var(--line); }
.prov li.done .mini i { background: var(--accent); }
.prov em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.recent button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--panel-line); background: none; border-radius: 12px; padding: 10px 12px; }
.recent button:hover { background: var(--soft); }
.recent i { width: 14px; height: 14px; border-radius: 50%; justify-self: center; }
.recent small { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 20; box-shadow: var(--shadow); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .brand h1 { font-size: 20px; white-space: nowrap; }
  .search { width: min(150px, 40vw); }
  .search input { padding: 7px 12px; }
  .brand p { display: none; }
  .dday { margin-top: 6px; padding: 2px 9px 2px 8px; font-size: 11.5px; }
  .dday b { font-size: 16px; }
  .panel { --peek-h: 78px; position: fixed; left: 0; right: 0; bottom: 0; height: min(74dvh, 680px); border-left: 0; border-top: 1px solid var(--panel-line); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.15); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; transform: translateY(calc(100% - var(--peek-h) - env(safe-area-inset-bottom, 0px))); transition: transform .38s cubic-bezier(.32,.72,0,1); will-change: transform; }
  .panel.open { transform: translateY(0); }
  .panel.dragging { transition: none; }
  .handle { display: block; width: 100%; border: 0; background: none; padding: 10px 0 4px; touch-action: none; cursor: grab; }
  .peek { touch-action: none; }
  .toast { top: 70px; bottom: auto; }
  .handle i { display: block; width: 40px; height: 4px; border-radius: 9px; background: var(--panel-line); margin: 0 auto; }
  .peek { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 20px 14px; border: 0; background: none; text-align: left; width: 100%; }
  .peek b { font-family: var(--font-hand); font-size: 24px; }
  .peek span { color: var(--muted); font-size: 12.5px; }
  .panel:not(.open) .pbody { visibility: hidden; transition: visibility 0s .38s; }
  .panel.open .peek { display: none; }
  .pbody { padding-top: 6px; }
  .zoom { bottom: 96px; }
  .legend { bottom: 96px; padding: 6px 10px; gap: 10px; font-size: 11.5px; }
  .rname { font-size: 34px; }
}
.ph-layer image { pointer-events: none; }
.ph-outline { fill: none; stroke: var(--line); stroke-width: .7; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.lb.on-photo { fill: #fff; stroke: rgba(20, 24, 36, .7); }
.photo-card { display: grid; gap: 10px; }
.ph-stage { position: relative; border-radius: 14px; background: var(--soft); border: 1px solid var(--panel-line); overflow: hidden; }
.ph-stage svg { display: block; width: 100%; height: 240px; touch-action: none; }
.ph-stage.editing svg { cursor: grab; }
.ph-stage.editing svg:active { cursor: grabbing; }
.ph-ghost { opacity: .28; }
.ph-edge { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.ph-tip { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--muted); font-size: 12px; padding: 4px 9px; border-radius: 999px; pointer-events: none; }
.ph-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ph-row .zoomrange { flex: 1; min-width: 120px; accent-color: var(--accent); }
.btn2 { border: 1px solid var(--panel-line); background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 500; }
.btn2:hover { background: var(--soft); }
.btn2.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn2.danger { color: var(--accent); }
.btn2:disabled { opacity: .5; cursor: default; }
.ph-drop { width: 100%; box-sizing: border-box; display: grid; place-items: center; gap: 4px; text-align: center; padding: 22px 14px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--soft); cursor: pointer; color: var(--ink); }
.ph-drop:hover { border-color: var(--accent); }
.ph-drop b { font-weight: 600; }
.ph-drop small { color: var(--muted); }
.ph-drop.busy { opacity: .6; pointer-events: none; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.ph-stage.viewable { cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(10, 13, 20, .95); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px)); color: #f3f5fa; animation: lbIn .22s ease-out; }
.lightbox .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lightbox .lb-top b { font-family: var(--font-hand); font-size: 28px; font-weight: 700; }
.lightbox .lb-top small { display: block; color: #b9c1d3; font-size: 12.5px; }
.lightbox .lb-close { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 7px 14px; }
.lightbox .lb-img { min-height: 0; display: grid; place-items: center; }
.lightbox .lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: lbZoom .28s cubic-bezier(.2,.7,.2,1); }
.lightbox .lb-memo { margin: 0 auto; max-width: 640px; font-family: var(--font-hand); font-size: 21px; line-height: 1.35; text-align: center; white-space: pre-wrap; color: #e8ecf5; }
@keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes lbZoom { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes swapIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pbody.swap > * { animation: swapIn .26s cubic-bezier(.2,.7,.2,1) both; }
.pbody.swap > *:nth-child(2) { animation-delay: .03s; } .pbody.swap > *:nth-child(3) { animation-delay: .06s; } .pbody.swap > *:nth-child(n+4) { animation-delay: .09s; }
.toast { animation: swapIn .2s ease-out; }
.trip-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.trip-head h3 { margin: 0; }
.trip-card { border: 1px solid var(--panel-line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; background: var(--panel); touch-action: pan-y; transition: transform .2s; }

.trip-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.trip-top b { font-family: var(--font-hand); font-size: 22px; font-weight: 700; }

.trip-nav .dots { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.trip-nav .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--panel-line); }

.ph-stage.viewable svg { touch-action: pan-y; }
.recent img.th { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; display: block; }

.tl-year:first-of-type { margin-top: 0; }
.more { width: 100%; margin-top: 8px; }

.cf-card { background: var(--panel); color: var(--ink); border-radius: 18px; padding: 20px; width: min(340px, 100%); box-sizing: border-box; box-shadow: var(--shadow); display: grid; gap: 8px; animation: swapIn .22s cubic-bezier(.2,.7,.2,1); }
.cf-card b { font-size: 16px; }

@keyframes tripNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes tripPrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

  // Keep Korea from drifting away: most of the map stays on screen, and once zoomed

  function bindSwipe(el, c) {
    let s = null;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, input, textarea, a')) return;
      s = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    el.addEventListener('pointermove', (e) => {
      if (!s || e.pointerId !== s.id) return;
      const dx = e.clientX - s.x;
      if (Math.abs(dx) > Math.abs(e.clientY - s.y)) { el.style.transition = 'none'; el.style.transform = `translateX(${dx / 3}px)`; }
    });
    const end = (e) => {
      if (!s || e.pointerId !== s.id) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y; s = null;
      el.style.transition = ''; el.style.transform = '';
      if (e.type === 'pointerup' && Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        swipeAt = performance.now();
        goTrip(c, dx < 0 ? 1 : -1);

    el.addEventListener('pointerup', end);

  let ed = null; // {svg, ghost, img, c}
  function drawEditor(c, editing) {
    const s = $('phSvg');
    const b = bbox[c];
    const pad = Math.max(b.width, b.height) * 0.08;
    s.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + pad * 2} ${b.height + pad * 2}`);
    s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    s.innerHTML = `<defs><clipPath id="edClip"><path d="${byCode[c].d}"></path></clipPath></defs>
      ${editing ? '<image id="edGhost" class="ph-ghost" preserveAspectRatio="none"></image>' : ''}
      <path d="${byCode[c].d}" fill="var(--land)"></path>
      <image id="edImg" clip-path="url(#edClip)" preserveAspectRatio="none"></image>
      <path class="ph-edge" d="${byCode[c].d}"></path>`;
    ed = { svg: s, c, ghost: s.querySelector('#edGhost'), img: s.querySelector('#edImg') };
    const p = edPhoto(c);
    ed.img.setAttribute('href', p.img);
    if (ed.ghost) ed.ghost.setAttribute('href', p.img);
    updateEditor();
    if (editing) bindEditor(s, c);
  }
  function updateEditor() {
    if (!ed) return;
    const p = edPhoto(ed.c);
    if (!p) return;
    const bx = photoBox(ed.c, p);
    setBox(ed.img, bx);
    if (ed.ghost) setBox(ed.ghost, bx);
    if (photoEdit && photoEdit.c === ed.c) paintPhoto(ed.c);
  }
  function bindEditor(s, c) {
    const pts = new Map();
    let start = null;
    const unit = () => { const m = s.getScreenCTM(); return m ? 1 / m.a : 1; };
    const b = bbox[c];
    s.addEventListener('pointerdown', (e) => {
      s.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const p = photoEdit.p;
      if (pts.size === 1) start = { x: e.clientX, y: e.clientY, ox: p.ox, oy: p.oy };
      if (pts.size === 2) { const [a, q] = [...pts.values()]; start = { d: Math.hypot(a.x - q.x, a.y - q.y), s: p.s }; }
    });
    s.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId) || !photoEdit) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const p = photoEdit.p;
      if (pts.size === 2 && start && start.d) {
        const [a, q] = [...pts.values()];
        p.s = start.s * Math.hypot(a.x - q.x, a.y - q.y) / start.d;
      } else if (pts.size === 1 && start && start.ox !== undefined) {
        const u = unit();
        p.ox = start.ox + (e.clientX - start.x) * u / b.width;
        p.oy = start.oy + (e.clientY - start.y) * u / b.height;
      }
      clampPhoto(c, p);
      const z = $('phZoom'); if (z) z.value = p.s;
      updateEditor();
    });
    const end = (e) => {
      pts.delete(e.pointerId);
      if (pts.size === 1 && photoEdit) { const [a] = [...pts.values()]; start = { x: a.x, y: a.y, ox: photoEdit.p.ox, oy: photoEdit.p.oy }; }
      else if (!pts.size) start = null;
    };
    s.addEventListener('pointerup', end);
    s.addEventListener('pointercancel', end);
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = photoEdit.p;
      p.s *= Math.exp(-e.deltaY * 0.002);
      clampPhoto(c, p);
      const z = $('phZoom'); if (z) z.value = p.s;
      updateEditor();
    }, { passive: false });
  }

  async function shrinkPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      let max = 1280, q = 0.8, out;
      do {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        out = { img: cv.toDataURL('image/jpeg', q), w, h };
        max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.05);
      } while (out.img.length > 280000 && max > 320);
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  $('photoFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];

  async function savePhotoEdit() {

  }

  function render() {

  // ---------- navigation (browser back closes things) ----------
  const drafts = {};
  // ---------- days together (first day counts as day 1) ----------
  // Tapping the badge rolls it through the next 100-day mark and anniversary, then back.
  const MET = [2024, 9, 13];
  function dayNum(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function together() {
    const now = new Date(), today = dayNum(now);
    const days = today - dayNum(new Date(MET[0], MET[1] - 1, MET[2])) + 1;
    const next100 = Math.ceil((days + 1) / 100) * 100;
    let y = now.getFullYear() - MET[0];
    if (dayNum(new Date(MET[0] + y, MET[1] - 1, MET[2])) <= today) y++;
    const yy = now.getFullYear() - MET[0];
    const party = yy > 0 && now.getMonth() === MET[1] - 1 && now.getDate() === MET[2] ? `${yy}주년`
      : days > 1 && days % 100 === 0 ? `${days}일` : '';
    return {
      days, party,
      marks: [
        { name: `${next100}일`, left: next100 - days },
        { name: `${y}주년`, left: dayNum(new Date(MET[0] + y, MET[1] - 1, MET[2])) - today },
      ].sort((a, b) => a.left - b.left),
    };
  }
  let ddKey = '', ddIdx = 0;
  function renderDday() {
    const el = $('dday'), t = together();
    if (t.days < 1) { el.hidden = true; return; }
    const key = t.days + t.party;
    if (key === ddKey) return;
    ddKey = key; ddIdx = 0;
    el.hidden = false;
    el.classList.toggle('party', !!t.party);
    const first = t.party ? `오늘 우리 <b>${t.party}</b> 🎉` : `만난 지 <b>${t.days}</b>일째`;
    el.innerHTML = `<span class="heart" aria-hidden="true">♥</span><span class="dd-roll">
      <span class="on">${first}</span>
      ${t.marks.map(m => `<span><span class="dl">${m.name}까지</span> <b>D-${m.left}</b></span>`).join('')}
    </span>`;
    el.setAttribute('aria-label', [`만난 지 ${t.days}일째`, ...t.marks.map(m => `${m.name}까지 ${m.left}일`)].join(', '));
  }
  let ddTimer = 0;
  function rollTo(i) {
    const items = $('dday').querySelectorAll('.dd-roll > span');
    if (i === ddIdx || !items[i]) return;
    const cur = items[ddIdx], nxt = items[i];
    ddIdx = i;
    cur.classList.remove('on'); cur.classList.add('out');
    nxt.classList.remove('out'); nxt.classList.add('on');
    setTimeout(() => cur.classList.remove('out'), 500);
  }
  $('dday').onclick = () => {
    const n = $('dday').querySelectorAll('.dd-roll > span').length;
    const step = () => {
      const i = (ddIdx + 1) % n;
      rollTo(i);
      ddTimer = i ? setTimeout(step, 2200) : 0;
    };
    clearTimeout(ddTimer);
    step();
  };
  renderDday();
  setInterval(renderDday, 60 * 1000);

  function isMobile() { return window.matchMedia('(max-width: 860px)').matches; }
  function setSheet(open) { $('panel').classList.toggle('open', open); }
  function swapIn() {
    const pb = $('pbody');
    pb.classList.remove('swap'); void pb.offsetWidth; pb.classList.add('swap');
  }
  function stashDraft() {
    if (selected && draft && draft.memo.trim() && draft.memo !== (visits[selected]?.memo || '')) drafts[selected] = draft;
  }
  function showRegion(c, zoom) {
    const changed = selected !== c;
    stashDraft();
    selected = c; draft = drafts[c] || null; delete drafts[c];
    if (changed) tripForm = null;
    setSheet(true);
    paint(); render();
    if (changed) { swapIn(); $('pbody').scrollTop = 0; }
    requestAnimationFrame(() => focusRegion(c, zoom));
  }
  function showOverview(sheetOpen) {
    const changed = !!selected;
    stashDraft();
    selected = null; draft = null; tripForm = null;
    setSheet(sheetOpen);
    paint(); render();
    if (changed) { swapIn(); $('pbody').scrollTop = 0; }
  }
  function openRegion(c, zoom) {
    const s = history.state || {};
    if (s.c === c) { showRegion(c, zoom); return; }
    if (s.c) history.replaceState({ c }, ''); else history.pushState({ c }, '');
    showRegion(c, zoom);
  }
  function select(c, zoom) { openRegion(c, zoom); }
  function openSheet() {
    if (!isMobile() || $('panel').classList.contains('open')) return;
    history.pushState({ sheet: 1 }, '');
    setSheet(true);
  }
  function goBack() {
    const s = history.state || {};
    if (s.c || s.sheet) history.back();
    else showOverview(false);
  }
  function openLightbox(c, id) {
    const p = tripPhoto(c, id); if (!p) return;
    const r = byCode[c], list = tripsOf(c), i = list.findIndex(t => t.id === id), t = list[i];
    $('lbImg').src = p.img;
    $('lbImg').alt = `${r.n} 사진`;
    $('lbTitle').textContent = r.n;
    $('lbSub').textContent = [r.g === r.n ? '' : r.g, list.length > 1 ? `${i + 1}번째 여행` : '', t?.date ? fmtDate(t.date) : ''].filter(Boolean).join(' · ');
    $('lbMemo').textContent = t?.memo || '';
    $('lightbox').hidden = false;
    history.pushState({ ...(history.state || {}), lb: 1 }, '');
    $('lbClose').focus();
  }
  function closeLightbox() { if ((history.state || {}).lb) history.back(); else $('lightbox').hidden = true; }
  $('lbClose').onclick = closeLightbox;
  $('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox' || e.target.id === 'lbImgWrap') closeLightbox(); });
  window.addEventListener('popstate', (e) => {
    const s = e.state || {};
    if (!$('lightbox').hidden && !s.lb) { $('lightbox').hidden = true; if (s.c === selected) return; }
    if (s.c && byCode[s.c]) showRegion(s.c, true);
    else showOverview(!!s.sheet);
  });

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200);
  }

  // ---------- storage ----------
  const LKEY = 'korea-coloring-map-v1', TKEY = 'korea-coloring-map-trips-v1';
  function loadLocal() {
    try { visits = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { visits = {}; }
    try { trips = JSON.parse(localStorage.getItem(TKEY) || '{}') || {}; } catch (e) { trips = {}; }
  }
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(visits)); localStorage.setItem(TKEY, JSON.stringify(trips)); } catch (e) {} }
  const PKEY = 'korea-coloring-map-photos-v1', TPKEY = 'korea-coloring-map-tripphotos-v1';
  function loadLocalPhotos() {
    try { photos = JSON.parse(localStorage.getItem(PKEY) || '{}') || {}; } catch (e) { photos = {}; }
    try { tripPhotos = JSON.parse(localStorage.getItem(TPKEY) || '{}') || {}; } catch (e) { tripPhotos = {}; }
  }
  function saveLocalPhotos() { try { localStorage.setItem(PKEY, JSON.stringify(photos)); localStorage.setItem(TPKEY, JSON.stringify(tripPhotos)); } catch (e) { toast('이 기기 저장 공간이 부족해서 사진은 새로고침하면 사라져요'); } }

  // Write several paths at once ({'visits/c/color': 'mint', 'trips/c': null, ...}).
  function applyPatch(u) {
    const st = { visits, photos, trips, tripPhotos };
    for (const [path, val] of Object.entries(u)) {
      const ks = path.split('/');
      let o = st;
      for (let i = 0; i < ks.length - 1 && o; i++) {
        if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') { if (val === null) { o = null; break; } o[ks[i]] = {}; }
        o = o[ks[i]];
      }
      if (!o) continue;
      const k = ks[ks.length - 1];
      if (val === null) delete o[k]; else o[k] = val;
    }
    for (const top of [trips, tripPhotos]) for (const k in top) if (!top[k] || !Object.keys(top[k]).length) delete top[k];
  }
  async function commit(u) {
    if (mode === 'shared') await fb.update(fb.ref(db), u);
    applyPatch(u);
    if (mode === 'local') {
      saveLocal();
      if (Object.keys(u).some(k => /^(photos|tripPhotos)\//.test(k))) saveLocalPhotos();
    }
  }
  function saveErr(e, newPath) {
    if (e && /permission/i.test(String(e.code || e.message))) {
      return newPath ? '저장 권한이 없어요. Firebase 보안 규칙에 trips·tripPhotos 허용을 추가해 주세요' : '저장 권한이 없어요. 보안 규칙을 확인해 주세요';
    }
    return '저장하지 못했어요. 잠시 뒤 다시 눌러주세요';
  }
  async function run(u, okMsg) {
    try {
      await commit(u);
      paint(); render();
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      toast(saveErr(e, Object.keys(u).some(k => /^(trips|tripPhotos)\//.test(k) && u[k] !== null)));
      return false;
    }
  }
  // everything a region holds besides its visit record
  function wipePatch(c) {
    const u = {};
    if (photos[c]) u['photos/' + c] = null;
    if (trips[c]) u['trips/' + c] = null;
    if (tripPhotos[c]) u['tripPhotos/' + c] = null;
    return u;
  }
  const latest = (dates) => dates.reduce((m, d) => (d > m ? d : m), '');

  // ---------- confirm dialog ----------
  let cfDone = null;
  function confirmBox(title, body, yes = '지울래요') {
    if (cfDone) cfDone(false);
    const back = document.activeElement;
    $('cfTitle').textContent = title;
    $('cfBody').textContent = body || '';
    $('cfBody').hidden = !body;
    $('cfYes').textContent = yes;
    $('confirm').hidden = false;
    $('cfNo').focus();
    return new Promise(res => {
      cfDone = (ok) => { cfDone = null; $('confirm').hidden = true; if (back && back.isConnected) back.focus(); res(ok); };
    });
  }
  $('cfYes').onclick = () => cfDone && cfDone(true);
  $('cfNo').onclick = () => cfDone && cfDone(false);
  $('confirm').addEventListener('click', (e) => { if (e.target.id === 'confirm' && cfDone) cfDone(false); });

  async function saveDraft() {
    const c = selected, r = byCode[c], v = visits[c];
    const st = v?.status || 'none', to = draft.status;
    const now = new Date().toISOString();
    if (to === st && to !== 'visited') return;
    if (st === 'visited' && to !== 'visited') {
      const n = tripsOf(c).length, nPh = tripsOf(c).filter(t => tripPhoto(c, t.id)).length;
      const what = `${n > 1 ? `여행 ${n}번의 ` : ''}날짜·메모${nPh ? `와 사진 ${nPh}장` : ''}`;
      const ok = to === 'none'
        ? await confirmBox(`${r.n} 기록을 지울까요?`, `${what}이 모두 지워지고 색칠도 사라져요. 되돌릴 수 없어요.`)
        : await confirmBox(`가고 싶은 곳으로 바꿀까요?`, `${what}이 모두 지워져요. 되돌릴 수 없어요.`, '바꿀래요');
      if (!ok) return;
    } else if (st === 'wish' && to === 'none') {
      if (!await confirmBox(`${r.n}을(를) 가고 싶은 곳에서 뺄까요?`, '', '뺄래요')) return;
    }
    $('save').disabled = true;
    let u, msg;
    if (to === 'none') { u = { ['visits/' + c]: null, ...wipePatch(c) }; msg = `${r.n} 기록을 지웠어요`; }
    else if (to === 'wish') { u = { ['visits/' + c]: { status: 'wish', date: '', color: '', memo: '', updatedAt: now }, ...wipePatch(c) }; msg = `${r.n}을(를) 가고 싶은 곳에 담았어요`; }
    else if (st === 'visited') { u = { [`visits/${c}/color`]: draft.color, [`visits/${c}/updatedAt`]: now }; msg = '색을 바꿨어요'; }
    else {
      u = { ['visits/' + c]: { status: 'visited', date: draft.date || today(), color: draft.color, memo: draft.memo.slice(0, 2000), updatedAt: now }, ...wipePatch(c) };
      msg = `${r.n}을(를) 칠했어요`;
    }
    if (photoEdit && photoEdit.c === c && to !== 'visited') photoEdit = null;
    const saved = draft;
    draft = null;
    if (await run(u, msg)) { delete drafts[c]; delete tripCur[c]; }
    else { draft = saved; render(); }
  }

  async function saveTrip() {
    const f = tripForm; if (!f || f.saving) return;
    const c = f.c, r = byCode[c], list = tripsOf(c);
    const now = new Date().toISOString();
    const date = f.date || today(), memo = f.memo.slice(0, 2000);
    const u = {};
    let id = f.tid;
    if (!id) {
      id = 't' + Date.now().toString(36);
      // first time a region gets a second trip: move the original one into trips/ too
      if (!tripsStored(c) && list[0]) u[`trips/${c}/t0`] = { date: list[0].date, memo: list[0].memo, updatedAt: visits[c].updatedAt || now };
      u[`trips/${c}/${id}`] = { date, memo, updatedAt: now };
    } else if (!tripsStored(c)) {
      u[`visits/${c}/memo`] = memo;
    } else {
      u[`trips/${c}/${id}`] = { date, memo, updatedAt: now };
    }
    u[`visits/${c}/date`] = latest([...list.filter(t => t.id !== id).map(t => t.date), date]);
    u[`visits/${c}/updatedAt`] = now;
    f.saving = true; renderTripSec();
    tripForm = null;
    if (await run(u, f.tid ? '여행 기록을 고쳤어요' : `${r.n} ${list.length + 1}번째 여행을 남겼어요`)) {
      tripCur[c] = id;
      if (selected === c) renderTripSec(f.tid ? 0 : 1);
    } else { f.saving = false; tripForm = f; renderTripSec(); }
  }

  async function deleteTrip(c, id) {
    const r = byCode[c], list = tripsOf(c), t = list.find(x => x.id === id);
    if (!t) return;
    const ph = !!tripPhoto(c, id);
    if (list.length <= 1) {
      if (!await confirmBox(`${r.n} 기록을 지울까요?`, `하나뿐인 여행이라 지우면 ${r.n} 색칠도 사라져요.${ph ? ' 붙여둔 사진도 같이 지워져요.' : ''} 되돌릴 수 없어요.`)) return;
      if (photoEdit && photoEdit.c === c) photoEdit = null;
      draft = null;
      if (await run({ ['visits/' + c]: null, ...wipePatch(c) }, `${r.n} 기록을 지웠어요`)) delete tripCur[c];
      return;
    }
    const i = list.indexOf(t);
    if (!await confirmBox(`${list.length > 1 ? `${i + 1}번째 ` : ''}여행을 지울까요?`, `${t.date ? fmtDate(t.date) + ' ' : ''}여행의 메모${ph ? '와 사진이' : '가'} 지워져요. 되돌릴 수 없어요.`)) return;
    const rest = list.filter(x => x.id !== id);
    const u = { [`trips/${c}/${id}`]: null, [`visits/${c}/date`]: latest(rest.map(x => x.date)), [`visits/${c}/updatedAt`]: new Date().toISOString() };
    if (ph) u[photoPath(c, id)] = null;
    if (await run(u, '여행을 지웠어요')) tripCur[c] = rest[Math.min(i, rest.length - 1)].id;
    if (selected === c) renderTripSec();
  }

  // ---------- search ----------
  const q = $('q'), sug = $('suggest');
  let sugIdx = 0, sugList = [];
  function showSug() {
    const term = q.value.trim().replace(/\s/g, '');
    if (!term) { sug.hidden = true; return; }
    sugList = regions.filter(r => (r.g + r.n).includes(term) || r.spots.some(s => s[0].includes(term))).slice(0, 8);
    sugIdx = 0;
    if (!sugList.length) { sug.innerHTML = `<li><button disabled><span>찾는 지역이 없어요</span></button></li>`; sug.hidden = false; return; }
    sug.innerHTML = sugList.map((r, i) => `<li><button data-c="${r.c}" class="${i === 0 ? 'on' : ''}"><span>${esc(r.n)}</span><small>${esc(r.g === r.n ? '' : r.g)}</small></button></li>`).join('');
    sug.hidden = false;
    sug.querySelectorAll('[data-c]').forEach(b => b.onclick = () => pick(b.dataset.c));
  }
  function pick(c) { q.value = ''; sug.hidden = true; q.blur(); select(c, true); }
  q.addEventListener('input', showSug);
  q.addEventListener('keydown', (e) => {
    if (sug.hidden || !sugList.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length) % sugList.length;
      sug.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sugIdx));
    } else if (e.key === 'Enter') { e.preventDefault(); pick(sugList[sugIdx].c); }
    else if (e.key === 'Escape') { sug.hidden = true; }
  });
  q.addEventListener('blur', () => setTimeout(() => sug.hidden = true, 150));

  // ---------- sheet ----------
  let sheetDrag = null, suppressClick = false;
  const panel = $('panel');
  function sheetTap() { if (panel.classList.contains('open')) goBack(); else openSheet(); }
  $('handle').onclick = () => { if (suppressClick) { suppressClick = false; return; } sheetTap(); };
  $('peek').onclick = () => { if (suppressClick) { suppressClick = false; return; } openSheet(); };
  for (const el of [$('handle'), $('peek')]) {
    el.addEventListener('pointerdown', (e) => {
      if (!isMobile()) return;
      const travel = panel.offsetHeight - 78;
      sheetDrag = { y: e.clientY, t: performance.now(), open: panel.classList.contains('open'), travel, off: 0, moved: 0 };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!sheetDrag) return;
      const dy = e.clientY - sheetDrag.y;
      sheetDrag.moved = Math.max(sheetDrag.moved, Math.abs(dy));
      if (sheetDrag.moved < 6) return;
      panel.classList.add('dragging');
      const base = sheetDrag.open ? 0 : sheetDrag.travel;
      sheetDrag.off = Math.max(0, Math.min(sheetDrag.travel, base + dy));
      panel.style.transform = `translateY(${sheetDrag.off}px)`;
    });
    const end = (e) => {
      if (!sheetDrag) return;
      const d = sheetDrag; sheetDrag = null;
      panel.classList.remove('dragging');
      panel.style.transform = '';
      if (d.moved < 6) return;
      suppressClick = true; setTimeout(() => suppressClick = false, 0);
      const v = (e.clientY - d.y) / Math.max(1, performance.now() - d.t);
      const wantOpen = Math.abs(v) > 0.5 ? v < 0 : d.off < d.travel * 0.5;
      if (wantOpen && !d.open) openSheet();
      else if (!wantOpen && d.open) goBack();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  document.addEventListener('keydown', (e) => {
    if (cfDone) { if (e.key === 'Escape') cfDone(false); return; }
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && selected && !typing && $('lightbox').hidden) { goTrip(selected, e.key === 'ArrowRight' ? 1 : -1); return; }
    if (e.key !== 'Escape' || document.activeElement?.tagName === 'TEXTAREA') return;
    if (!$('lightbox').hidden) { closeLightbox(); return; }
    if (selected || (isMobile() && panel.classList.contains('open'))) goBack();
  });

  let lastW = stage.clientWidth;
  window.addEventListener('resize', () => {
    if (Math.abs(stage.clientWidth - lastW) < 2) return;
    lastW = stage.clientWidth; fit();
  });
  fit(); paint(); render();

  // ---------- connect ----------
  (async () => {
  try {
    const [appMod, dbMod] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-database.js')]);
    fb = dbMod;
    db = fb.getDatabase(appMod.initializeApp(firebaseConfig));
    mode = 'shared';
    fb.onValue(fb.ref(db, 'visits'), (snap) => {
      const v = snap.val() || {};
      const next = {};
      for (const k in v) if (byCode[k] && v[k] && v[k].status) next[k] = v[k];
      visits = next;
      paint();
      if (selected && draft) renderPeek(); else render();
    }, () => { mode = 'local'; loadLocal(); loadLocalPhotos(); paint(); render(); });
    fb.onValue(fb.ref(db, 'photos'), (snap) => {
      const v = snap.val() || {};
      const next = {};
      for (const k in v) if (byCode[k] && v[k] && v[k].img) next[k] = v[k];
      photos = next;
      paintPhotos();
      if (selected && !tripForm && !(photoEdit && photoEdit.c === selected)) renderTripSec();
      renderPeek();
    }, () => {});
    const keep = (v) => { const next = {}; for (const k in v || {}) if (byCode[k] && v[k] && typeof v[k] === 'object') next[k] = v[k]; return next; };
    const synced = () => {
      paint();
      if (!selected) render();
      else { renderPeek(); if (!tripForm && !(photoEdit && photoEdit.c === selected)) renderTripSec(); }
    };
    fb.onValue(fb.ref(db, 'trips'), (snap) => { trips = keep(snap.val()); synced(); }, () => {});
    fb.onValue(fb.ref(db, 'tripPhotos'), (snap) => { tripPhotos = keep(snap.val()); synced(); }, () => {});
  } catch (e) { mode = 'local'; loadLocal(); loadLocalPhotos(); paint(); render(); }
  })();
})();
</script>

</body>
</html>
