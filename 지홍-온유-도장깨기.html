<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>지홍♥온유 도장깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a paper map on a pale sea, pan/zoom canvas left, a notebook panel right (bottom sheet on phones). */
:root {
  --sea: #dde8f1;
  --land: #fcfdff;
  --line: #8592a8;
  --ink: #23304a;
  --muted: #5b6780;
  --panel: #ffffff;
  --panel-line: #e1e6ee;
  --soft: #f1f4f8;
  --accent: #d9475f;
  --accent-ink: #ffffff;
  --label: #3a4560;
  --halo: rgba(252, 253, 255, .85);
  --shadow: 0 10px 30px rgba(35, 48, 74, .12);
  --c-peach: #f6b8a6;
  --c-butter: #f3dc86;
  --c-mint: #a7dbc2;
  --c-sky: #a9cbee;
  --c-lilac: #c8b5e8;
  --c-rose: #f1b2cd;
  --on-color: #26304a;
  --font-hand: "Gaegu", "Nanum Pen Script", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #101823; --land: #1c2635; --line: #4e5d76; --ink: #e7ecf5; --muted: #9ba7bc;
    --panel: #161f2c; --panel-line: #283346; --soft: #1e2938; --accent: #ff7d92; --accent-ink: #1a1220;
    --label: #c5cee0; --halo: rgba(28, 38, 53, .85); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #101823; --land: #1c2635; --line: #4e5d76; --ink: #e7ecf5; --muted: #9ba7bc;
  --panel: #161f2c; --panel-line: #283346; --soft: #1e2938; --accent: #ff7d92; --accent-ink: #1a1220;
  --label: #c5cee0; --halo: rgba(28, 38, 53, .85); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 1fr 380px; }
.stage { position: relative; min-width: 0; overflow: hidden; }

.topbar { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; z-index: 3; }
.brand { pointer-events: auto; }
.brand h1 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -.5px; }
.brand h1 .heart { color: var(--accent); margin: 0 2px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.search { pointer-events: auto; position: relative; width: min(240px, 46vw); }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); }
.suggest { position: absolute; top: 40px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; }
.suggest button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; }
.suggest button:hover, .suggest button.on { background: var(--soft); }
.suggest small { color: var(--muted); }

svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg.map.dragging { cursor: grabbing; }
.rg { fill: var(--land); stroke: var(--line); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .25s; cursor: pointer; }
.rg:hover { stroke: var(--ink); stroke-width: 1.2; }
.rg.wish { fill: url(#hatch); }
.rg.visited.peach { fill: var(--c-peach); } .rg.visited.butter { fill: var(--c-butter); }
.rg.visited.mint { fill: var(--c-mint); } .rg.visited.sky { fill: var(--c-sky); }
.rg.visited.lilac { fill: var(--c-lilac); } .rg.visited.rose { fill: var(--c-rose); }
.sel { fill: none; stroke: var(--accent); stroke-width: 2.6; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.hatch-bg { fill: var(--land); } .hatch-line { stroke: var(--accent); stroke-width: 1.4; opacity: .55; }
.lb { font-family: var(--font-body); font-weight: 500; fill: var(--label); text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.lb.on-color { fill: var(--on-color); stroke: none; }
.lb.hide { display: none; }

.zoom { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 6px; z-index: 2; }
.zoom button { min-width: 38px; padding: 0 8px; height: 38px; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--panel); box-shadow: var(--shadow); font-size: 18px; line-height: 1; }
.legend { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 8px 12px; font-size: 12px; color: var(--muted); z-index: 2; box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.legend .l-none { background: var(--land); }
.legend .l-wish { background: repeating-linear-gradient(45deg, var(--land) 0 3px, var(--accent) 3px 4.5px); }
.legend .l-visit { background: linear-gradient(135deg, var(--c-peach), var(--c-mint) 50%, var(--c-sky)); }

/* panel */
.panel { background: var(--panel); border-left: 1px solid var(--panel-line); display: flex; flex-direction: column; min-height: 0; z-index: 4; }
.handle { display: none; }
.peek { display: none; }
.pbody { overflow: auto; padding: 20px 20px 28px; display: grid; gap: 22px; align-content: start; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.rname { margin: 2px 0 0; font-family: var(--font-hand); font-weight: 700; font-size: 40px; line-height: 1.05; text-wrap: balance; }
.headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.close { border: 1px solid var(--panel-line); background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-top: 8px; }
.pill.none { background: var(--soft); color: var(--muted); }
.pill.wish { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.pill.visited { color: var(--on-color); }
h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.spots { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.spot { border: 1px solid var(--panel-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.spot b { font-size: 15px; font-weight: 600; }
.spot p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.spot a { font-size: 12.5px; color: var(--accent); text-decoration: none; justify-self: start; }
.spot a:hover { text-decoration: underline; }
.insta { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--soft); border: 1px dashed var(--line); font-weight: 600; }
.insta:hover { border-style: solid; }
.insta small { font-weight: 400; color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 9px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 12.5px; color: var(--muted); }
.field input[type=date], .field textarea { border: 1px solid var(--panel-line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
.field textarea { min-height: 84px; resize: vertical; font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--panel-line); outline-offset: -1px; }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.save { border: 0; border-radius: 12px; padding: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.save:disabled { opacity: .5; cursor: default; }
.meta { font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.memo-view { font-family: var(--font-hand); font-size: 20px; line-height: 1.35; white-space: pre-wrap; margin: 0; }

/* overview */
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-family: var(--font-hand); font-size: 56px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.prov { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.prov li { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; }
.prov .mini { height: 5px; border-radius: 9px; background: var(--soft); overflow: hidden; }
.prov .mini i { display: block; height: 100%; background: var(--line); }
.prov li.done .mini i { background: var(--accent); }
.prov em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.recent button { width: 100%; display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--panel-line); background: none; border-radius: 12px; padding: 10px 12px; }
.recent button:hover { background: var(--soft); }
.recent i { width: 14px; height: 14px; border-radius: 50%; }
.recent small { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 20; box-shadow: var(--shadow); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .brand h1 { font-size: 20px; white-space: nowrap; }
  .search { width: min(150px, 40vw); }
  .search input { padding: 7px 12px; }
  .brand p { display: none; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; border-left: 0; border-top: 1px solid var(--panel-line); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.15); max-height: 64%; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .handle { display: block; border: 0; background: none; padding: 8px 0 2px; }
  .handle i { display: block; width: 40px; height: 4px; border-radius: 9px; background: var(--panel-line); margin: 0 auto; }
  .peek { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 20px 14px; border: 0; background: none; text-align: left; width: 100%; }
  .peek b { font-family: var(--font-hand); font-size: 24px; }
  .peek span { color: var(--muted); font-size: 12.5px; }
  .panel:not(.open) .pbody { display: none; }
  .panel.open .peek { display: none; }
  .pbody { padding-top: 6px; }
  .zoom { bottom: 96px; }
  .legend { bottom: 96px; padding: 6px 10px; gap: 10px; font-size: 11.5px; }
  .rname { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="topbar">
      <div class="brand">
        <h1>지홍<span class="heart">♥</span>온유 도장깨기</h1>
        <p>지홍이랑 온유가 같이 다녀온 시·군을 하나씩 깨요</p>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="지역 찾기 (예: 담양)" autocomplete="off" aria-label="지역 찾기">
        <ul class="suggest" id="suggest" hidden></ul>
      </div>
    </div>
    <svg class="map" id="map" aria-label="대한민국 시군 지도">
      <defs>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
          <rect class="hatch-bg" width="4" height="4"></rect>
          <line class="hatch-line" x1="0" y1="0" x2="0" y2="4"></line>
        </pattern>
      </defs>
      <g id="world"><g id="regions"></g><path id="sel" class="sel" d=""></path><g id="labels"></g></g>
    </svg>
    <div class="legend" aria-hidden="true">
      <span><i class="l-none"></i>아직</span>
      <span><i class="l-wish"></i>가고 싶어</span>
      <span><i class="l-visit"></i>다녀왔어</span>
    </div>
    <div class="zoom">
      <button id="zin" aria-label="확대">+</button>
      <button id="zout" aria-label="축소">−</button>
      <button id="zfit" aria-label="전체 보기" style="font-size:13px;white-space:nowrap">전체</button>
    </div>
  </div>
  <aside class="panel" id="panel">
    <button class="handle" id="handle" aria-label="패널 열고 닫기"><i></i></button>
    <button class="peek" id="peek"><b id="peekCount">0곳</b><span id="peekSub">지역을 눌러 여행지를 찾아보세요</span></button>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>

  let selected = null;
  let draft = null;

  // ---------- build svg ----------
  const gRegions = $('regions'), gLabels = $('labels');
  const pathEls = {}, labelEls = {}, bbox = {};
  for (const r of regions) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', r.d);
    p.setAttribute('class', 'rg');
    p.dataset.c = r.c;
    const t = document.createElementNS(NS, 'title');
    t.textContent = `${r.g === r.n ? '' : r.g + ' '}${r.n}`;
    p.appendChild(t);
    gRegions.appendChild(p);
    pathEls[r.c] = p;
    const l = document.createElementNS(NS, 'text');
    l.setAttribute('class', 'lb');
    l.setAttribute('x', r.lx); l.setAttribute('y', r.ly);
    l.textContent = r.n;
    gLabels.appendChild(l);
    labelEls[r.c] = l;
  }
  for (const r of regions) { const b = pathEls[r.c].getBBox(); bbox[r.c] = b; }
  const bySize = [...regions].sort((a, b) => bbox[b.c].width * bbox[b.c].height - bbox[a.c].width * bbox[a.c].height);

  // ---------- pan / zoom ----------
  const svg = $('map'), world = $('world'), stage = $('stage');
  let view = { s: 1, x: 0, y: 0 };
  let fitS = 1;
  function bottomInset() { return window.matchMedia('(max-width: 860px)').matches ? 84 : 0; }
  function fit(animate) {
    const W = stage.clientWidth, H = stage.clientHeight - bottomInset();
    const top = 70;
    const s = Math.min(W / MAP.w, (H - top) / MAP.h) * 0.96;
    fitS = s;
    view = { s, x: (W - MAP.w * s) / 2, y: top + (H - top - MAP.h * s) / 2 };
    apply();
  }
  let labelRaf = 0;
  function apply() {
    world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`);
    if (!labelRaf) labelRaf = requestAnimationFrame(updateLabels);
  }
  function updateLabels() {
    labelRaf = 0;
    const px = 11.5;
    const fs = px / view.s;
    gLabels.setAttribute('font-size', fs);
    const placed = [];
    for (const r of bySize) {
      const b = bbox[r.c], l = labelEls[r.c];
      const needW = r.n.length * px * 0.98;
      let show = b.width * view.s > needW * 0.9 && b.height * view.s > px * 1.4;
      if (show) {
        const cx = r.lx * view.s + view.x, cy = r.ly * view.s + view.y;
        const box = [cx - needW / 2 - 2, cy - px * 0.7, cx + needW / 2 + 2, cy + px * 0.7];
        if (placed.some(p => box[0] < p[2] && box[2] > p[0] && box[1] < p[3] && box[3] > p[1])) show = false;
        else placed.push(box);
      }
      l.classList.toggle('hide', !show);
      l.style.strokeWidth = (3 / view.s) + 'px';
    }
  }
  function zoomAt(factor, cx, cy) {
    const ns = Math.max(fitS * 0.8, Math.min(fitS * 14, view.s * factor));
    const k = ns / view.s;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.s = ns;
    apply();
  }
  function center() { return [stage.clientWidth / 2, (stage.clientHeight - bottomInset()) / 2]; }
  $('zin').onclick = () => zoomAt(1.5, ...center());
  $('zout').onclick = () => zoomAt(1 / 1.5, ...center());
  $('zfit').onclick = () => fit();
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0018), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  const pointers = new Map();
  let dragStart = null, moved = 0, pinch = null;
  svg.addEventListener('pointerdown', (e) => {
    svg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { dragStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = 0; }
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s };
      moved = 99;
    }
  });
  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const rect = svg.getBoundingClientRect();
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2 - rect.left, cy = (a.y + b.y) / 2 - rect.top;
      zoomAt((pinch.s * d / pinch.d) / view.s, cx, cy);
      return;
    }
    if (pointers.size === 1 && dragStart) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (moved > 4) {
        svg.classList.add('dragging');
        view.x = dragStart.vx + dx; view.y = dragStart.vy + dy; apply();
      }
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      svg.classList.remove('dragging');
      if (moved <= 4 && e.type === 'pointerup') {
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const p = hit && hit.closest && hit.closest('.rg');
        if (p) select(p.dataset.c, false);
      }
      dragStart = null;
    } else if (pointers.size === 1) {
      const [p] = [...pointers.values()];
      dragStart = { x: p.x, y: p.y, vx: view.x, vy: view.y };
    }
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  function focusRegion(c) {
    const b = bbox[c];
    const W = stage.clientWidth;
    let H = stage.clientHeight - bottomInset();
    if (bottomInset() && $('panel').classList.contains('open')) H = Math.max(160, $('panel').getBoundingClientRect().top - stage.getBoundingClientRect().top);
    const sx = b.x * view.s + view.x, sy = b.y * view.s + view.y;
    const sw = b.width * view.s, sh = b.height * view.s;
    let s = view.s;
    if (sw < 70 && sh < 70) s = Math.min(fitS * 14, Math.min(W, H) * 0.35 / Math.max(b.width, b.height));
    const offscreen = sx < 0 || sy < 60 || sx + sw > W || sy + sh > H;
    if (s !== view.s || offscreen) {
      view.s = s;
      view.x = W / 2 - (b.x + b.width / 2) * s;
      view.y = (H + 60) / 2 - (b.y + b.height / 2) * s;
      apply();
    }
  }

  // ---------- render ----------
  function paint() {
    for (const r of regions) {
      const v = visits[r.c];
      const p = pathEls[r.c];
      p.setAttribute('class', 'rg' + (v ? ' ' + v.status + (v.status === 'visited' ? ' ' + (v.color || 'peach') : '') : ''));
      labelEls[r.c].classList.toggle('on-color', !!v && v.status === 'visited');
    }
    $('sel').setAttribute('d', selected ? byCode[selected].d : '');
  }
  function counts() {
    let visited = 0, wish = 0;
    for (const k in visits) { if (!byCode[k]) continue; if (visits[k].status === 'visited') visited++; else if (visits[k].status === 'wish') wish++; }
    return { visited, wish };
  }
  function renderPeek() {
    const c = counts();
    $('peekCount').textContent = `${c.visited}곳 색칠`;
    $('peekSub').textContent = `전체 ${total}개 시·군 중 ${Math.round(c.visited / total * 100)}% · 가고 싶은 곳 ${c.wish}`;
  }
  function modeNote() {
    if (mode === 'local') return `<p class="note">미리보기 버전이라 색칠한 기록은 지금 이 브라우저에만 저장돼요.</p>`;
    if (mode === 'shared' && !canWrite) return `<p class="note">보기 권한만 있어서 색칠은 할 수 없어요. 지도 주인에게 편집 권한으로 초대해 달라고 해주세요.</p>`;
    if (mode === 'connecting') return `<p class="note">공유 지도를 불러오는 중이에요…</p>`;
    return '';
  }

  async function renderOverview() {
    const c = counts();
    const pct = Math.round(c.visited / total * 100);
    const groups = {};
    for (const g of GROUP_ORDER) groups[g] = { t: 0, v: 0 };
    for (const r of regions) { groups[r.g].t++; if (visits[r.c]?.status === 'visited') groups[r.g].v++; }
    const recent = Object.entries(visits)
      .filter(([k, v]) => byCode[k] && v.status === 'visited')
      .sort((a, b) => (b[1].date || '').localeCompare(a[1].date || '') || (b[1].updatedAt || '').localeCompare(a[1].updatedAt || ''))
      .slice(0, 8);
    const wishes = Object.entries(visits).filter(([k, v]) => byCode[k] && v.status === 'wish').slice(0, 12);
    $('pbody').innerHTML = `
      ${modeNote()}
      <section>
        <div class="eyebrow">우리가 칠한 곳</div>
        <div class="big"><b>${c.visited}</b><span>/ ${total} 시·군</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="sub">${pct}% 채웠어요${c.wish ? ` · 가고 싶은 곳 ${c.wish}곳` : ''}</div>
      </section>
      <section>
        <h3>최근 다녀온 곳</h3>
        ${recent.length ? `<ul class="recent">${recent.map(([k, v]) => `<li><button data-go="${k}"><i style="background:var(--c-${esc(v.color || 'peach')})"></i><span>${esc(byCode[k].g === byCode[k].n ? byCode[k].n : byCode[k].g + ' ' + byCode[k].n)}</span><small>${esc(fmtDate(v.date))}</small></button></li>`).join('')}</ul>`
          : `<p class="empty">아직 칠한 곳이 없어요. 지도에서 다녀온 시·군을 누르고 <b>다녀왔어</b>를 골라 첫 칸을 칠해보세요.</p>`}
      </section>
      ${wishes.length ? `<section><h3>가고 싶은 곳</h3><ul class="recent">${wishes.map(([k]) => `<li><button data-go="${k}"><i style="background:repeating-linear-gradient(45deg,var(--land) 0 2px,var(--accent) 2px 3.5px)"></i><span>${esc(byCode[k].g === byCode[k].n ? byCode[k].n : byCode[k].g + ' ' + byCode[k].n)}</span><small></small></button></li>`).join('')}</ul></section>` : ''}
      <section>
        <h3>지역별 진행</h3>
        <ul class="prov">${GROUP_ORDER.map(g => { const x = groups[g]; return `<li class="${x.v === x.t ? 'done' : ''}"><span>${g}</span><span class="mini"><i style="width:${Math.round(x.v / x.t * 100)}%"></i></span><em>${x.v}/${x.t}</em></li>`; }).join('')}</ul>
      </section>`;
    $('pbody').querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go, true));
  }

  async function renderRegion() {
    const r = byCode[selected];
    const v = visits[r.c];
    if (!draft) draft = { status: v?.status || 'none', date: v?.date || today(), color: v?.color || 'peach', memo: v?.memo || '' };
    const st = v?.status || 'none';
    const pill = st === 'visited' ? `<span class="pill visited" style="background:var(--c-${esc(v.color || 'peach')})">다녀왔어 · ${esc(fmtDate(v.date))}</span>`
      : st === 'wish' ? `<span class="pill wish">가고 싶어</span>` : `<span class="pill none">아직 안 가봤어</span>`;
    let who = '';
    if (v?.by && user && user.profiles) {
      try { const ps = await user.profiles([v.by]); const n = ps[v.by]?.name; if (n) who = n; } catch (e) {}
    }
    if (selected !== r.c) return;
    const tag = tagName(r);
    const editable = mode !== 'connecting' && (mode === 'local' || canWrite);
    $('pbody').innerHTML = `
      <div>
        <div class="headrow">
          <div>
            <div class="eyebrow">${esc(r.g === r.n ? '특별·광역시' : r.g)}</div>
            <h2 class="rname">${esc(r.n)}</h2>
            ${pill}
          </div>
          <button class="close" id="back">전체 보기</button>
        </div>
      </div>
      ${v?.status === 'visited' && v.memo ? `<section><h3>우리의 메모</h3><p class="memo-view"></p>${who ? `<div class="meta">${esc(who)} 님이 기록</div>` : ''}</section>` : ''}
      <section>
        <h3>가볼 만한 곳</h3>
        <ul class="spots">${r.spots.map(([n, d]) => `<li class="spot"><b>${esc(n)}</b><p>${esc(d)}</p><a href="https://map.naver.com/p/search/${encodeURIComponent(r.n + ' ' + n.split('·')[0])}" target="_blank" rel="noopener">네이버 지도에서 찾기 ↗</a></li>`).join('')}</ul>
      </section>
      <a class="insta" href="https://www.instagram.com/explore/tags/${encodeURIComponent(tag)}/" target="_blank" rel="noopener">#${esc(tag)} <small>인스타그램에서 보기 ↗</small></a>
      <section>
        <h3>우리 기록</h3>
        ${modeNote()}
        <div class="form">
          <div class="seg" role="group" aria-label="상태">
            <button id="st-none" data-st="none" aria-pressed="${draft.status === 'none'}">아직</button>
            <button id="st-wish" data-st="wish" aria-pressed="${draft.status === 'wish'}">가고 싶어</button>
            <button id="st-visited" data-st="visited" aria-pressed="${draft.status === 'visited'}">다녀왔어</button>
          </div>
          <div id="visitFields" ${draft.status === 'visited' ? '' : 'hidden'} class="form">
            <div class="field"><label for="f-date">다녀온 날</label><input type="date" id="f-date" value="${esc(draft.date)}"></div>
            <div class="field"><span class="lbl">칠할 색</span><div class="swatches">${COLORS.map(([k, n]) => `<button class="sw" data-col="${k}" aria-label="${n}" aria-pressed="${draft.color === k}" style="background:var(--c-${k})"></button>`).join('')}</div></div>
            <div class="field"><label for="f-memo">메모</label><textarea id="f-memo" placeholder="뭐 먹었는지, 어디가 좋았는지 적어두면 나중에 더 좋아요"></textarea></div>
          </div>
          <button class="save" id="save" ${editable ? '' : 'disabled'}>${draft.status === 'visited' ? '색칠하기' : draft.status === 'wish' ? '가고 싶은 곳에 담기' : '기록 지우기'}</button>
          ${v?.updatedAt && who && !(v.status === 'visited' && v.memo) ? `<div class="meta">${esc(who)} 님이 마지막으로 기록</div>` : ''}
        </div>
      </section>`;
    const memoView = $('pbody').querySelector('.memo-view');
    if (memoView) memoView.textContent = v.memo;
    $('f-memo') && ($('f-memo').value = draft.memo);
    $('back').onclick = () => { selected = null; draft = null; paint(); render(); };
    $('pbody').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { draft.status = b.dataset.st; renderRegion(); });
    $('pbody').querySelectorAll('[data-col]').forEach(b => b.onclick = () => {
      draft.color = b.dataset.col;
      $('pbody').querySelectorAll('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    $('f-date') && ($('f-date').oninput = (e) => draft.date = e.target.value);
    $('f-memo') && ($('f-memo').oninput = (e) => draft.memo = e.target.value);
    $('save').onclick = saveDraft;
  }

  function render() {
    renderPeek();
    if (selected) renderRegion(); else renderOverview();
  }

  function select(c, zoom) {
    selected = c; draft = null;
    $('panel').classList.add('open');
    paint(); render();
    $('pbody').scrollTop = 0;
    if (zoom) requestAnimationFrame(() => focusRegion(c));
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200);
  }

  // ---------- storage ----------
  const LKEY = 'korea-coloring-map-v1';
  function loadLocal() { try { visits = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { visits = {}; } }
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(visits)); } catch (e) {} }

  async function saveDraft() {
    const c = selected; const r = byCode[c];
    const btn = $('save'); btn.disabled = true;
    const rec = draft.status === 'none' ? null : {
      status: draft.status,
      date: draft.status === 'visited' ? (draft.date || today()) : '',
      color: draft.status === 'visited' ? draft.color : '',
      memo: draft.status === 'visited' ? draft.memo.slice(0, 2000) : '',
      by: myId || '',
      updatedAt: new Date().toISOString(),
    };
    try {
      if (mode === 'shared') {
        const ref = db.collection('visits').doc(c);
        if (rec) await ref.set(rec); else await ref.delete();
      }
      if (rec) visits[c] = rec; else delete visits[c];
      if (mode === 'local') saveLocal();
      draft = null; paint(); render();
      toast(rec ? (rec.status === 'visited' ? `${r.n}을(를) 칠했어요` : `${r.n}을(를) 가고 싶은 곳에 담았어요`) : `${r.n} 기록을 지웠어요`);
    } catch (e) {
      btn.disabled = false;
      if (e && e.code === 'invalid_argument') { canWrite = false; render(); toast('이 지도에 기록할 권한이 없어요'); }
      else if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼어요');
      else toast('저장하지 못했어요. 잠시 뒤 다시 눌러주세요');
    }
  }

  // ---------- search ----------
  const q = $('q'), sug = $('suggest');
  let sugIdx = 0, sugList = [];
  function showSug() {
    const term = q.value.trim().replace(/\s/g, '');
    if (!term) { sug.hidden = true; return; }
    sugList = regions.filter(r => (r.g + r.n).includes(term) || r.spots.some(s => s[0].includes(term))).slice(0, 8);
    sugIdx = 0;
    if (!sugList.length) { sug.innerHTML = `<li><button disabled><span>찾는 지역이 없어요</span></button></li>`; sug.hidden = false; return; }
    sug.innerHTML = sugList.map((r, i) => `<li><button data-c="${r.c}" class="${i === 0 ? 'on' : ''}"><span>${esc(r.n)}</span><small>${esc(r.g === r.n ? '' : r.g)}</small></button></li>`).join('');
    sug.hidden = false;
    sug.querySelectorAll('[data-c]').forEach(b => b.onclick = () => pick(b.dataset.c));
  }
  function pick(c) { q.value = ''; sug.hidden = true; q.blur(); select(c, true); }
  q.addEventListener('input', showSug);
  q.addEventListener('keydown', (e) => {
    if (sug.hidden || !sugList.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length) % sugList.length;
      sug.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sugIdx));
    } else if (e.key === 'Enter') { e.preventDefault(); pick(sugList[sugIdx].c); }
    else if (e.key === 'Escape') { sug.hidden = true; }
  });
  q.addEventListener('blur', () => setTimeout(() => sug.hidden = true, 150));

  // ---------- sheet ----------
  $('handle').onclick = () => $('panel').classList.toggle('open');
  $('peek').onclick = () => $('panel').classList.add('open');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected && document.activeElement?.tagName !== 'TEXTAREA') { selected = null; draft = null; paint(); render(); } });

  window.addEventListener('resize', () => fit());
  fit(); paint(); render();

  // ---------- connect ----------
  (async () => {
    try {
      if (window.claude && window.claude.use) {
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) { db = null; }
    if (!db) { mode = 'local'; loadLocal(); paint(); render(); return; }
    mode = 'shared';
    try { myId = user ? await user.id() : null; } catch (e) {}
    try { const w = user ? await user.can('data.write') : null; if (w === false) canWrite = false; } catch (e) {}
    db.collection('visits').onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      visits = next;
      paint();
      if (selected && draft) renderPeek(); else render();
    }, () => { mode = 'local'; loadLocal(); paint(); render(); });
    render();
  })();
})();
</script>

</body>
</html>
